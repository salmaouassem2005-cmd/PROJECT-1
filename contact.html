<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact · Hello, World!</title>
    <style>
      :root { color-scheme:dark; --ink:#f8fafc; --muted:#cbd5e1; --violet:#a78bfa; --cyan:#67e8f9; } * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:2rem; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 80%,rgba(139,92,246,.42),transparent 28rem),radial-gradient(circle at 88% 12%,rgba(6,182,212,.32),transparent 30rem),#090b18; }
      main { width:min(100%,760px); padding:clamp(2rem,7vw,5rem); border:1px solid rgba(255,255,255,.18); border-radius:2rem; background:rgba(15,19,43,.68); box-shadow:0 28px 80px rgba(0,0,0,.42); backdrop-filter:blur(18px); } nav { display:flex; gap:.55rem; margin-bottom:4rem; } nav a { padding:.55rem .9rem; border:1px solid transparent; border-radius:999px; color:var(--muted); font-size:.88rem; font-weight:700; text-decoration:none; } nav a:hover,nav a[aria-current="page"] { color:var(--ink); border-color:rgba(103,232,249,.42); background:rgba(103,232,249,.1); }
      .eyebrow { color:var(--cyan); font-size:.78rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:.8rem 0 1.3rem; font-size:clamp(3rem,9vw,5.5rem); line-height:.95; letter-spacing:-.07em; background:linear-gradient(110deg,#fff 20%,var(--cyan) 52%,var(--violet) 85%); -webkit-background-clip:text; background-clip:text; color:transparent; } p { color:var(--muted); font-size:1.13rem; line-height:1.75; } form { display:grid; gap:1rem; margin-top:2rem; } label { display:grid; gap:.45rem; color:#e5e7eb; font-size:.9rem; font-weight:700; } input,textarea { width:100%; padding:.85rem 1rem; border:1px solid rgba(255,255,255,.16); border-radius:.75rem; outline:none; background:rgba(255,255,255,.06); color:var(--ink); font:inherit; } input:focus,textarea:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(103,232,249,.12); } textarea { min-height:7rem; resize:vertical; } button { justify-self:start; padding:.82rem 1.2rem; border:0; border-radius:.85rem; cursor:pointer; background:linear-gradient(110deg,var(--cyan),var(--violet)); color:#090b18; font:inherit; font-weight:800; } button:hover { filter:brightness(1.08); }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <div class="eyebrow">Say hello</div>
      <h1>Let's make<br>something.</h1>
      <p>Have an idea or just want to wave? Send a message below.</p>
      <form onsubmit="event.preventDefault(); this.querySelector('button').textContent='Message sent ✦'; this.reset();">
        <label>Name<input type="text" name="name" placeholder="Your name" required /></label>
        <label>Email<input type="email" name="email" placeholder="you@example.com" required /></label>
        <label>Message<textarea name="message" placeholder="What’s on your mind?" required></textarea></label>
        <button type="submit">Send message →</button>
      </form>
    </main>
  </body>
</html>
