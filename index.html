<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --violet: #a78bfa;
        --cyan: #67e8f9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 15%, rgba(139, 92, 246, .42), transparent 28rem),
          radial-gradient(circle at 82% 78%, rgba(6, 182, 212, .32), transparent 30rem),
          #090b18;
      }

      .orb {
        position: fixed;
        width: 18rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .5;
        animation: drift 12s ease-in-out infinite alternate;
        background: linear-gradient(135deg, var(--violet), transparent 65%);
      }
      .orb:first-child { top: -5rem; right: 8vw; }
      .orb:nth-child(2) { bottom: -7rem; left: 7vw; background: linear-gradient(135deg, var(--cyan), transparent 65%); animation-delay: -5s; }

      main {
        width: min(90vw, 760px);
        padding: clamp(2rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 2rem;
        background: rgba(15, 19, 43, .65);
        box-shadow: 0 28px 80px rgba(0, 0, 0, .42), inset 0 1px rgba(255,255,255,.09);
        backdrop-filter: blur(18px);
        animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
      }

      .eyebrow {
        margin: 0 0 1.2rem;
        color: var(--cyan);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.8rem);
        line-height: .95;
        letter-spacing: -.07em;
        background: linear-gradient(110deg, #fff 20%, var(--cyan) 52%, var(--violet) 85%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p { margin: 1.6rem auto 0; max-width: 34rem; color: var(--muted); font-size: clamp(1rem, 2vw, 1.18rem); line-height: 1.7; }
      .sparkle { display: inline-block; animation: sparkle 1.8s ease-in-out infinite; }

      @keyframes arrive { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes drift { to { transform: translate(2rem, 1.5rem) rotate(18deg); } }
      @keyframes sparkle { 50% { transform: scale(1.35) rotate(18deg); filter: drop-shadow(0 0 8px var(--cyan)); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div class="orb"></div>
    <div class="orb"></div>
    <main>
      <div class="eyebrow">A tiny beginning</div>
      <h1>Hello, World!</h1>
      <p>Something beautiful starts with a single line of code. <span class="sparkle">✦</span></p>
    </main>
  </body>
</html>
